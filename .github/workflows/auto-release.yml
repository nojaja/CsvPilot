name: Auto Release on Version Change

# package.json の version 変更を検知し、タグ作成を必須実行したうえで
# 選択済み公開先（npm / GitHub Release）へ自動公開するワークフロー
on:
  push:
    branches: ['main']
    paths:
      - 'package.json'

env:
  TAG_PREFIX: 'v'
  PACKAGE_PATH: 'package.json'
  CHANGELOG_PATH: 'CHANGELOG.md'
  # node -v (このセッションで実行): v22.21.0
  # package.json の engines.node: 未定義
  # 上記より固定値として 22.x を採用
  NODE_VERSION: '22.x'

permissions:
  contents: write

jobs:
  check-version:
    # 現在 version と「最新のバージョンタグ」が指す version を比較する
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      tag_exists: ${{ steps.check.outputs.tag_exists }}
      latest_tag: ${{ steps.previous.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 現在のバージョンを取得
        id: current
        run: |
          VERSION=$(node -p "require('./${PACKAGE_PATH}').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "現在のバージョン: $VERSION"

      - name: 最新バージョンタグ側のバージョンを取得
        id: previous
        run: |
          LATEST_TAG=$(git tag -l "${TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

          if [ -n "$LATEST_TAG" ]; then
            git show "$LATEST_TAG:${PACKAGE_PATH}" > /tmp/prev-package.json 2>/dev/null || true
          fi

          if [ -f /tmp/prev-package.json ]; then
            PREV_VERSION=$(node -p "require('/tmp/prev-package.json').version")
            echo "version=$PREV_VERSION" >> $GITHUB_OUTPUT
            echo "最新タグ($LATEST_TAG)のバージョン: $PREV_VERSION"
          else
            echo "version=0.0.0" >> $GITHUB_OUTPUT
            echo "比較対象タグが見つからないため初回リリース扱い"
          fi

      - name: バージョン差分とタグ存在を判定
        id: check
        run: |
          CURRENT_VERSION="${{ steps.current.outputs.version }}"
          PREVIOUS_VERSION="${{ steps.previous.outputs.version }}"
          TAG_NAME="${TAG_PREFIX}${CURRENT_VERSION}"

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "✅ バージョンが変更されました: $PREVIOUS_VERSION → $CURRENT_VERSION"

            if git ls-remote --exit-code --tags origin "$TAG_NAME" >/dev/null 2>&1; then
              echo "tag_exists=true" >> $GITHUB_OUTPUT
              echo "⚠️ タグ $TAG_NAME は既に存在します"
            else
              echo "tag_exists=false" >> $GITHUB_OUTPUT
              echo "✨ 新規タグ $TAG_NAME を作成します"
            fi
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ バージョン差分はありません"
          fi

  test:
    # npm 公開前の固定マトリクステスト
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # package.json の engines.node と node -v 実測結果から確定した固定値
        node-version: ['22.x']
    steps:
      - uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node-version }} をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 依存パッケージをインストール
        run: npm ci

      - name: テストを実行
        run: npm test

  create-tag:
    # npm 公開ありのため、test 成功後にタグ作成ジョブを実行
    needs: [check-version, test]
    if: github.event_name == 'push' && needs.check-version.outputs.version_changed == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: タグを作成して push（未作成時のみ）
        if: needs.check-version.outputs.tag_exists == 'false'
        run: |
          TAG_NAME="${{ needs.check-version.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
          echo "✅ タグ $TAG_NAME を作成しました"

      - name: タグ作成スキップを記録
        if: needs.check-version.outputs.tag_exists == 'true'
        run: |
          echo "ℹ️ タグ ${{ needs.check-version.outputs.tag_name }} は既存のため作成をスキップしました"

  publish-npm:
    # npm へ公開（OIDC Trusted Publishing）
    needs: [check-version, create-tag, test]
    if: github.event_name == 'push' && needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Node.js をセットアップ（npmjs レジストリ）
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      # ランナー側 npm 不整合（Cannot find module 'promise-retry'）が発生した場合のみ有効化:
      # - name: npm ワークアラウンド（固定版）
      #   run: npm i -g npm@10.8.2

      - name: 依存パッケージをインストール
        run: npm ci

      - name: プロダクションビルド
        run: npm run build

      - name: npm publish（Trusted Publishing）
        run: npm publish --access public

      # NPM.js Trusted Publisher 登録手順:
      # 1) NPM.js の対象パッケージ設定で Trusted Publisher を開く
      # 2) Provider は GitHub Actions を選択
      # 3) Organization or user: nojaja
      # 4) Repository: CsvPilot
      # 5) Workflow filename: auto-release.yml
      # 6) Environment name: 空欄

  create-release:
    # GitHub Release を作成（タグ作成ジョブ後）
    needs: [check-version, create-tag]
    if: github.event_name == 'push' && needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CHANGELOG から該当バージョン本文を抽出
        id: changelog
        run: |
          TAG_NAME="${{ needs.check-version.outputs.tag_name }}"
          VERSION_NO_PREFIX="${TAG_NAME#${TAG_PREFIX}}"

          if [ -f "$CHANGELOG_PATH" ]; then
            START_LINE=$(grep -n "## \[$VERSION_NO_PREFIX\]" "$CHANGELOG_PATH" | head -1 | cut -d: -f1)

            if [ -n "$START_LINE" ]; then
              NEXT_LINE=$(tail -n +$((START_LINE + 1)) "$CHANGELOG_PATH" | grep -n "## \[" | head -1 | cut -d: -f1)

              if [ -n "$NEXT_LINE" ]; then
                END_LINE=$((START_LINE + NEXT_LINE - 1))
                CONTENT=$(sed -n "${START_LINE},${END_LINE}p" "$CHANGELOG_PATH" | tail -n +2)
              else
                CONTENT=$(tail -n +$((START_LINE + 1)) "$CHANGELOG_PATH")
              fi

              {
                echo 'content<<EOF'
                echo "$CONTENT"
                echo 'EOF'
              } >> $GITHUB_OUTPUT
            else
              echo "content=バージョン $VERSION_NO_PREFIX の変更内容" >> $GITHUB_OUTPUT
            fi
          else
            echo "content=バージョン $VERSION_NO_PREFIX のリリース" >> $GITHUB_OUTPUT
          fi

      - name: GitHub Release を作成
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          name: Release ${{ needs.check-version.outputs.tag_name }}
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: false
